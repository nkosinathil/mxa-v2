<VirtualHost *:80>
    ServerName mobile.gismartanalytics.com
    ServerAlias 192.168.1.66
    
    DocumentRoot /var/www/mxa-mobile-app/current/php-app/public
    
    <Directory /var/www/mxa-mobile-app/current/php-app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable URL rewriting
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>
    
    # PHP-FPM Configuration
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost"
    </FilesMatch>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mxa-mobile-error.log
    CustomLog ${APACHE_LOG_DIR}/mxa-mobile-access.log combined
    
    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # File Upload Limits
    php_value upload_max_filesize 2G
    php_value post_max_size 2G
    php_value memory_limit 512M
    php_value max_execution_time 300
    
    # Disable directory browsing
    Options -Indexes
    
    # Protect sensitive files
    <FilesMatch "(^#.*#|\.(bak|config|dist|fla|inc|ini|log|psd|sh|sql|swp)|~)$">
        Require all denied
    </FilesMatch>
</VirtualHost>

