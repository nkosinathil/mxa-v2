; MxA Mobile Analytics upload/runtime overrides for php8.1-fpm
; Existing server had upload_max_filesize=2M and post_max_size=8M.
; Raise limits for forensic evidence archives.

upload_max_filesize = 2048M
post_max_size = 2048M
max_file_uploads = 50
max_execution_time = 0
max_input_time = 0
memory_limit = 1024M

; Keep long-running requests from being terminated while waiting for API.
default_socket_timeout = 600
