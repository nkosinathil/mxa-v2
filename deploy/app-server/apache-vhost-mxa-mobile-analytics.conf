# MxA Mobile Analytics app vhost for 192.168.1.66
# Derived from existing Apache/PHP-FPM layout in app-server report.

<VirtualHost *:80>
    ServerName 192.168.1.66
    ServerAdmin admin@gismartanalytics.com

    DocumentRoot /var/www/gismartanalytics/public
    DirectoryIndex index.php index.html

    <Directory /var/www/gismartanalytics/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mxa-mobile-analytics-error.log
    CustomLog ${APACHE_LOG_DIR}/mxa-mobile-analytics-access.log combined

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # Needed for long OCR uploads and backend polling.
    Timeout 600
    ProxyTimeout 600

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.1-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    <FilesMatch "^\\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "(^\\.env|composer\\.json|composer\\.lock|\\.git)">
        Require all denied
    </FilesMatch>
</VirtualHost>
