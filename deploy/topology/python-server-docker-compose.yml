version: '3.9'

services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  api:
    build:
      context: ../../python-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../python-backend/.env
    volumes:
      - ../../:/workspace
    ports:
      - '8000:8000'
    depends_on:
      - redis
      - minio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ../../python-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../python-backend/.env
    volumes:
      - ../../:/workspace
    depends_on:
      - redis
      - minio
    command: celery -A app.tasks worker --loglevel=info

volumes:
  minio_data:
